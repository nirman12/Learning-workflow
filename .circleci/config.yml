version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.10
        environment:
          DB_PASSWORD: $DB_PASSWORD

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            pip install -r requirements.txt

      - run:
          name: Run tests
          command: |
            echo "Running with DB password (masked)"
            python -m pytest
